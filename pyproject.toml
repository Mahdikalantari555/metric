[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metric_et"
version = "0.1.0"
description = "METRIC Evapotranspiration model for Landsat data"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "METRIC ETa Developers"},
]
keywords = ["evapotranspiration", "landsat", "remote-sensing", "energy-balance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "xarray>=2023.1",
    "rasterio>=1.3",
    "rioxarray>=0.14",
    "geopandas>=0.14",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "cartopy>=0.22",
    "click>=8.1",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "tqdm>=4.65",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
metric = "metric_et.cli.interface:cli"

[tool.setuptools.packages.find]
where = ["."]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
